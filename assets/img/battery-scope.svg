<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Which batteries need a passport</title><desc id="d">From 18 February 2027 a passport is required for electric-vehicle batteries, batteries for light means of transport such as e-bikes, e-scooters and e-mopeds, and industrial batteries above 2 kWh including home storage – for every such battery placed on the EU market or put into service, including repurposed or remanufactured ones. No passport is required for portable batteries, starter batteries and industrial batteries up to 2 kWh. Responsible is the economic operator that places the finished battery on the market; it may authorise another operator in writing but stays responsible.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.card{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.6}.no{fill:none;stroke:#8a959c;stroke-width:1.3;stroke-dasharray:6 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.strip{fill:#f0f2f1}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.cls{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.num{fill:#0b6e4f}.numt{fill:#ffffff}.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}.sep{stroke:#e2e5e8;stroke-width:1}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}.s{font-size:13px}.c{font-size:13px;font-weight:600}
.big{font-size:22px;font-weight:700}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.card{fill:#173229;stroke:#4cc293}.no{stroke:#6b767d}.box{fill:#1b1f22;stroke:#3a4247}.strip{fill:#22272b}
.chip{fill:#1b1f22;stroke:#6b767d}.cls{fill:#173229;stroke:#4cc293}.num{fill:#4cc293}.numt{fill:#121517}.line{stroke:#4cc293}.sep{stroke:#2c3236}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="396"/>
<text class="lbl muted" x="20" y="30">A PASSPORT IS REQUIRED FROM 18 FEBRUARY 2027</text>
<rect class="card" x="20" y="46" width="300" height="104" rx="14"/>
<text class="h ink" x="38" y="76">Electric-vehicle batteries</text>
<text class="s muted" x="38" y="100">traction batteries for</text>
<text class="s muted" x="38" y="119">electric and hybrid road vehicles</text>
<rect class="card" x="330" y="46" width="300" height="104" rx="14"/>
<text class="h ink" x="348" y="76">Light means of transport</text>
<text class="s muted" x="348" y="100">batteries for e-bikes,</text>
<text class="s muted" x="348" y="119">e-scooters and e-mopeds</text>
<rect class="card" x="640" y="46" width="300" height="104" rx="14"/>
<text class="h ink" x="658" y="76">Industrial batteries above 2 kWh</text>
<text class="s muted" x="658" y="100">including home storage</text>
<text class="s muted" x="658" y="119">and other stationary storage</text>
<text class="s ink" x="20" y="178">… for every battery of these kinds placed on the EU market or put into service – including a repurposed or remanufactured one.</text>
<text class="lbl muted" x="20" y="222">NO PASSPORT</text>
<rect class="no" x="20" y="236" width="300" height="70" rx="12"/>
<text class="c ink" x="38" y="262">Portable batteries</text>
<text class="s muted" x="38" y="284">e.g. for phones, laptops, tools</text>
<rect class="no" x="330" y="236" width="300" height="70" rx="12"/>
<text class="c ink" x="348" y="262">Starter batteries (SLI)</text>
<text class="s muted" x="348" y="284">starting, lighting, ignition</text>
<rect class="no" x="640" y="236" width="300" height="70" rx="12"/>
<text class="c ink" x="658" y="262">Industrial up to 2 kWh</text>
<text class="s muted" x="658" y="284">below the capacity threshold</text>
<rect class="strip" x="20" y="326" width="920" height="54" rx="10"/>
<text class="c ink" x="38" y="350">Responsible: the economic operator that places the finished battery on the market.</text>
<text class="s muted" x="38" y="370">It may authorise another operator in writing to keep the passport, but stays responsible. Cells and modules need no passport of their own.</text>
</svg>