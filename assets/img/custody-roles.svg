<text class="c accent" x="20" y="226">Mandate for the custodian</text>
<text class="s accent" x="20" y="247">one passport, one collection,</text>
<text class="s accent" x="20" y="266">at most 90 days, signed by</text>
<text class="s accent" x="20" y="285">the operator, revocable</text>
<line class="line" x1="485" y1="162" x2="485" y2="237" marker-end="url(#a)"/>
<text class="s accent" x="474" y="195" text-anchor="end">writes under</text>
<text class="s accent" x="474" y="212" text-anchor="end">the mandate</text>
<line class="line" x1="720" y1="162" x2="613" y2="280" marker-end="url(#a)"/>
<text class="s accent" x="712" y="205">open the link</text>
<text class="s accent" x="712" y="222">on the product</text>
<line class="no" x1="612" y1="330" x2="687" y2="333" marker-end="url(#a)"/>
<text class="s muted" x="20" y="340">Both providers act on the operator's</text>
<text class="s muted" x="20" y="359">behalf; the responsibility for the</text>
<text class="s muted" x="20" y="378">passport stays with the operator.</text>
