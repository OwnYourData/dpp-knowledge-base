<text class="s muted" x="36" y="105">responsible for the</text>
<text class="s muted" x="36" y="124">passport; holds its keys,</text>
<text class="s muted" x="36" y="143">owns the domain on the</text>
<text class="s muted" x="36" y="162">product – DPP Manager</text>
<rect class="box" x="360" y="40" width="250" height="120" rx="14"/>
<text class="lbl muted" x="376" y="62">DPP SERVICE PROVIDER</text>
<text class="h ink" x="376" y="84">DPP Service</text>
<text class="s muted" x="376" y="105">API of EN 18222, index,</text>
<text class="s muted" x="376" y="124">access classes and grants</text>
<text class="s muted" x="376" y="143">– run by OwnYourData</text>
<rect class="card" x="360" y="240" width="250" height="140" rx="14"/>
<text class="lbl muted" x="376" y="262">DPP SERVICE PROVIDER</text>
<text class="h ink" x="376" y="284">Custodian</text>
<text class="s muted" x="376" y="305">keeps the passport in the</text>
<text class="s muted" x="376" y="324">operator's collection and</text>
<text class="s muted" x="376" y="343">answers the link on the product</text>
<text class="s muted" x="376" y="362">– data intermediary, DID FlexCo</text>
