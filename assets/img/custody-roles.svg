<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Who keeps the passport</title><desc id="d">Four roles. The economic operator is responsible for the passport, holds its keys and owns the domain on the product – here with the DPP Manager. It submits the passport, signed, to the DPP Service of OwnYourData, which offers the EN 18222 API, the index and access control. It signs a mandate for the custodian – one passport, one collection, at most 90 days, revocable – and the DPP Service writes under that mandate. The custodian, the data intermediary of DID FlexCo, keeps the passport in the operator's collection and answers the link on the product, which readers open. Dashed: a back-up provider keeping a second copy, not appointed here yet. Both providers act on the operator's behalf; the responsibility stays with the operator.</desc>
