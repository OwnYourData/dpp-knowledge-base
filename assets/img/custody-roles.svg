.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.cls{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.num{fill:#0b6e4f}.numt{fill:#ffffff}.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}.sep{stroke:#e2e5e8;stroke-width:1}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}.s{font-size:13px}.c{font-size:13px;font-weight:600}.qr{fill:#1d2327}
.big{font-size:22px;font-weight:700}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.card{fill:#173229;stroke:#4cc293}.no{stroke:#6b767d}.box{fill:#1b1f22;stroke:#3a4247}.strip{fill:#22272b}
.chip{fill:#1b1f22;stroke:#6b767d}.cls{fill:#173229;stroke:#4cc293}.num{fill:#4cc293}.numt{fill:#121517}.line{stroke:#4cc293}.sep{stroke:#2c3236}.qr{fill:#e8ebed}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
