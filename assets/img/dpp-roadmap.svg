.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}.wip{fill:#8a5a00}
.grid{stroke:#e2e5e8;stroke-width:1}.axis{stroke:#c9d0d4;stroke-width:1.2}
.fixed{fill:#0b6e4f}.fixedbar{fill:#0b6e4f;opacity:.85}
.ind{fill:#ffffff;stroke:#8a5a00;stroke-width:2.2}
.est{fill:url(#fade)}.today{stroke:#8a5a00;stroke-width:1.6;stroke-dasharray:4 4}
.stop0{stop-color:#e6b85c;stop-opacity:.75}.stop1{stop-color:#e6b85c;stop-opacity:0}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:12.5px}.yr{font-size:13px;font-weight:600}.lg{font-size:13px}.on{fill:#ffffff;font-size:12.5px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}.wip{fill:#e6b85c}
.grid{stroke:#2c3236}.axis{stroke:#3a4247}.fixed{fill:#4cc293}.fixedbar{fill:#4cc293}
.ind{fill:#1b1f22;stroke:#e6b85c}.today{stroke:#e6b85c}.on{fill:#121517}
.stop0{stop-color:#e6b85c;stop-opacity:.45}}
</style>
