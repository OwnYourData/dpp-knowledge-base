<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" width="960" height="602" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Roadmap of digital product passports by product group</title>
<desc id="d">Batteries: passport mandatory from 18 February 2027. Under the ESPR, delegated acts are planned for iron and steel in 2026, textiles, tyres and aluminium in 2027, furniture in 2028 and mattresses in 2029; passports apply at the earliest 18 months after each act. Detergents: the new regulation applies from 23 September 2029. Toys: from 1 August 2030. Construction products: product family by product family. As of October 2026, no ESPR delegated act has been adopted.</desc>
