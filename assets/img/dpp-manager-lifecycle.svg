<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A passport's life in the DPP Manager</title>
  <desc id="d">The DPP Manager runs on the economic operator's own computer and keeps everything in one encrypted file: keys, product types, passports and the event log. A passport is described with a form from its product type, gets its own identifier, is submitted to a DPP service, kept at a custodian under a signed mandate, corrected when needed, and finally ended. Access classes and access rights decide who reads which part. Keys never leave the file, and nothing is sent until the operator presses the button that sends it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .home { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; }
    .file { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .step { fill: #ffffff; stroke: #0b6e4f; stroke-width: 1.6; }
    .out { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.6; }
    .side { fill: #fbf0d9; stroke: #8a5a00; stroke-width: 1.4; }
    .num { fill: #0b6e4f; }
    .numt { fill: #ffffff; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .wip { fill: #8a5a00; }
    .line { stroke: #0b6e4f; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8a959c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14.5px; font-weight: 600; }
    .s { font-size: 13px; }
    .lbl { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; }
    .n { font-size: 13px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .home { fill: #121517; stroke: #3a4247; }
      .file { fill: #1b1f22; stroke: #3a4247; }
      .step { fill: #1b1f22; stroke: #4cc293; }
      .out { fill: #173229; stroke: #4cc293; }
      .side { fill: #33291a; stroke: #e6b85c; }
      .num { fill: #4cc293; }
      .numt { fill: #121517; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .wip { fill: #e6b85c; }
      .line { stroke: #4cc293; }
      .dash { stroke: #6b767d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="470"/>

  <!-- own computer -->
  <rect class="home" x="20" y="20" width="620" height="430" rx="18"/>
  <text class="lbl muted" x="40" y="48">ON YOUR OWN COMPUTER</text>

  <!-- encrypted file -->
  <rect class="file" x="40" y="66" width="580" height="74" rx="12"/>
  <text class="h ink" x="60" y="94">One encrypted file, opened with your passphrase</text>
  <text class="s muted" x="60" y="118">keys · product types · passports · access rights · event log</text>

  <!-- steps -->
  <rect class="step" x="40" y="164" width="180" height="96" rx="12"/>
  <circle class="num" cx="62" cy="188" r="11"/><text class="n numt" x="62" y="193" text-anchor="middle">1</text>
  <text class="p ink" x="82" y="193">Describe</text>
  <text class="s muted" x="56" y="218">a form generated from</text>
  <text class="s muted" x="56" y="236">the product type</text>

  <rect class="step" x="240" y="164" width="180" height="96" rx="12"/>
  <circle class="num" cx="262" cy="188" r="11"/><text class="n numt" x="262" y="193" text-anchor="middle">2</text>
  <text class="p ink" x="282" y="193">Identify</text>
  <text class="s muted" x="256" y="218">its own did:oyd, minted</text>
  <text class="s muted" x="256" y="236">here – keys stay here</text>

  <rect class="step" x="440" y="164" width="180" height="96" rx="12"/>
  <circle class="num" cx="462" cy="188" r="11"/><text class="n numt" x="462" y="193" text-anchor="middle">3</text>
  <text class="p ink" x="482" y="193">Submit</text>
  <text class="s muted" x="456" y="218">signed with your identity,</text>
  <text class="s muted" x="456" y="236">built to EN 18223</text>

  <rect class="step" x="40" y="284" width="180" height="96" rx="12"/>
  <circle class="num" cx="62" cy="308" r="11"/><text class="n numt" x="62" y="313" text-anchor="middle">6</text>
  <text class="p ink" x="82" y="313">End</text>
  <text class="s muted" x="56" y="338">final state kept as history,</text>
  <text class="s muted" x="56" y="356">identifier revoked</text>

  <rect class="step" x="240" y="284" width="180" height="96" rx="12"/>
  <circle class="num" cx="262" cy="308" r="11"/><text class="n numt" x="262" y="313" text-anchor="middle">5</text>
  <text class="p ink" x="282" y="313">Correct</text>
  <text class="s muted" x="256" y="338">differences to the service</text>
  <text class="s muted" x="256" y="356">shown, sent on purpose</text>

  <rect class="step" x="440" y="284" width="180" height="96" rx="12"/>
  <circle class="num" cx="462" cy="308" r="11"/><text class="n numt" x="462" y="313" text-anchor="middle">4</text>
  <text class="p ink" x="482" y="313">Keep</text>
  <text class="s muted" x="456" y="338">at a custodian of your</text>
  <text class="s muted" x="456" y="356">choice, under a mandate</text>

  <line class="line" x1="222" y1="212" x2="236" y2="212" marker-end="url(#a)"/>
  <line class="line" x1="422" y1="212" x2="436" y2="212" marker-end="url(#a)"/>
  <line class="line" x1="530" y1="262" x2="530" y2="280" marker-end="url(#a)"/>
  <line class="line" x1="438" y1="332" x2="424" y2="332" marker-end="url(#a)"/>
  <line class="line" x1="238" y1="332" x2="224" y2="332" marker-end="url(#a)"/>

  <text class="s muted" x="40" y="420">Your keys never leave this file. Nothing is sent until you press the button that sends it.</text>

  <!-- outside -->
  <rect class="out" x="680" y="150" width="260" height="96" rx="14"/>
  <text class="h ink" x="700" y="180">DPP service</text>
  <text class="s muted" x="700" y="204">EN 18222 API, e.g. the public</text>
  <text class="s muted" x="700" y="222">instance of OwnYourData</text>
  <rect class="out" x="680" y="270" width="260" height="96" rx="14"/>
  <text class="h ink" x="700" y="300">Custodian</text>
  <text class="s muted" x="700" y="324">serves the public part</text>
  <text class="s muted" x="700" y="342">on the link on the product</text>
  <line class="line" x1="622" y1="212" x2="676" y2="200" marker-end="url(#a)"/>
  <line class="line" x1="622" y1="332" x2="676" y2="320" marker-end="url(#a)"/>

  <rect class="side" x="680" y="390" width="260" height="60" rx="12"/>
  <text class="p wip" x="700" y="415">Access classes and rights</text>
  <text class="s ink" x="700" y="436">who reads which part</text>
</svg>
