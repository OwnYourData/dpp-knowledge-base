<title id="t">The data points in numbers</title><desc id="d">229 data points from EU legal acts: 79 construction products, 71 batteries, 56 ecodesign, 21 toys, 2 deforestation. Access: 130 public, 61 left to the delegated act, 29 restricted to named actors, 9 where the act is silent.</desc>
