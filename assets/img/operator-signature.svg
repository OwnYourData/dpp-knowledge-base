<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The economic operator's signature on a passport</title><desc id="d">Three steps. 1 Sign: the economic operator fetches the public part of its passport in the full representation without a token and signs it as a compact JWS with the document key of its own DID, alg EdDSA, kid DID#key-doc. 2 Submit: PUT /dpp/v1/dpps/{dppId}/signature with the owner's token; the DPP Service checks form, owner, key and payload, keeps the signature and never signs itself. 3 Verify: any reader asks with Accept: application/jose and representation=full and checks the JWS against the operator's DID and the passport. The header X-DPP-Signature-State is none, signed, pending after every write, or stale when the key no longer verifies. Today for passports in the service's own database, not yet for passports held by a custodian.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.band1{fill:#e3f2ec}.band2{fill:#fbf0d9}.band3{fill:#e7edf7}.band4{fill:#f3e8f7}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.chip.key{stroke:#0b6e4f;stroke-width:1.6}
.chip.plan{fill:none;stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.tag{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.span{fill:none;stroke:#8a959c;stroke-width:1.4;stroke-dasharray:6 4}
.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}
.s{font-size:13px}.c{font-size:13px;font-weight:600}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.band1{fill:#173229}.band2{fill:#33291a}.band3{fill:#1d2635}.band4{fill:#2c2033}
.chip{fill:#1b1f22;stroke:#6b767d}.chip.key{stroke:#4cc293}.chip.plan{fill:none}
.box{fill:#1b1f22;stroke:#3a4247}.tag{fill:#173229;stroke:#4cc293}.span{stroke:#6b767d}.line{stroke:#4cc293}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="470"/>
<text class="lbl muted" x="20" y="30">THE ECONOMIC OPERATOR SIGNS · THE DPP SERVICE CHECKS AND KEEPS · ANY READER VERIFIES</text>
<rect class="box" x="20" y="48" width="286" height="200" rx="12"/>
<text class="h ink" x="38" y="80">1  Sign</text>
<rect class="tag" x="38" y="92" width="147" height="26" rx="13"/><text class="c ink" x="112" y="110" text-anchor="middle">Economic operator</text>
<text class="s muted" x="38" y="148">fetches the public part, full</text>
<text class="s muted" x="38" y="170">representation, without a token</text>
<text class="s muted" x="38" y="192">signs it as a compact JWS</text>
<text class="s muted" x="38" y="214">alg EdDSA · kid &lt;DID>#key-doc</text>
<line class="line" x1="309" y1="148" x2="334" y2="148" marker-end="url(#a)"/>
<rect class="box" x="337" y="48" width="286" height="200" rx="12"/>
<text class="h ink" x="355" y="80">2  Submit</text>
<rect class="tag" x="355" y="92" width="104" height="26" rx="13"/><text class="c ink" x="407" y="110" text-anchor="middle">DPP Service</text>
<text class="s muted" x="355" y="148">PUT …/dpps/{dppId}/signature</text>
<text class="s muted" x="355" y="170">with the owner's token</text>
<text class="s muted" x="355" y="192">checks form, owner, key, payload</text>
<text class="s muted" x="355" y="214">keeps it – never signs itself</text>
<line class="line" x1="626" y1="148" x2="651" y2="148" marker-end="url(#a)"/>
<rect class="box" x="654" y="48" width="286" height="200" rx="12"/>
<text class="h ink" x="672" y="80">3  Verify</text>
<rect class="tag" x="672" y="92" width="97" height="26" rx="13"/><text class="c ink" x="720" y="110" text-anchor="middle">Any reader</text>
<text class="s muted" x="672" y="148">Accept: application/jose</text>
<text class="s muted" x="672" y="170">representation=full</text>
<text class="s muted" x="672" y="192">checks the JWS against the</text>
<text class="s muted" x="672" y="214">operator's DID and the passport</text>
<rect class="band3" x="20" y="278" width="920" height="150" rx="12"/>
<text class="lbl muted" x="40" y="306">X-DPP-SIGNATURE-STATE</text>
<rect class="chip " x="40" y="326" width="150" height="32" rx="16"/><text class="c ink" x="115" y="347" text-anchor="middle">none</text>
<text class="s muted" x="40" y="382">never signed</text>
<rect class="chip key" x="265" y="326" width="150" height="32" rx="16"/><text class="c ink" x="340" y="347" text-anchor="middle">signed</text>
<text class="s muted" x="265" y="382">accepted, still verifies</text>
<rect class="chip plan" x="490" y="326" width="150" height="32" rx="16"/><text class="c ink" x="565" y="347" text-anchor="middle">pending</text>
<text class="s muted" x="490" y="382">written since – sign again</text>
<rect class="chip " x="715" y="326" width="150" height="32" rx="16"/><text class="c ink" x="790" y="347" text-anchor="middle">stale</text>
<text class="s muted" x="715" y="382">key no longer verifies</text>
<line class="line" x1="193" y1="342" x2="262" y2="342" marker-end="url(#a)"/>
<line class="line" x1="418" y1="342" x2="487" y2="342" marker-end="url(#a)"/>
<text class="s muted" x="40" y="412">Every write discards the signature (pending). Only a signature that matches the passport as it stands is handed out.</text>
<text class="s muted" x="20" y="456">Today for passports in the service's own database; not yet for passports held by a custodian.</text>
</svg>