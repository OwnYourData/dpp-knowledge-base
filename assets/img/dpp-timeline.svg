<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Digital Product Passport milestones</title>
  <desc id="d">July 2024: the Ecodesign for Sustainable Products Regulation enters into force. April 2025: the ESPR working plan names the first product groups. July 2026: six harmonised standards are cited and the EU DPP registry goes live. February 2027: the battery passport becomes mandatory. Next: one delegated act per product group, with passports applying at the earliest 18 months after each act.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .wip { fill: #8a5a00; }
    .axis { stroke: #0b6e4f; stroke-width: 3; }
    .axis-next { stroke: #8a959c; stroke-width: 3; stroke-dasharray: 7 7; }
    .tick { stroke: #c9d0d4; stroke-width: 1.5; }
    .dot { fill: #ffffff; stroke: #0b6e4f; stroke-width: 3; }
    .dot-now { fill: #0b6e4f; }
    .dot-next { fill: #ffffff; stroke: #8a959c; stroke-width: 3; }
    .pill { fill: #e3f2ec; }
    .pill-wip { fill: #fbf0d9; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .date { font-size: 15px; font-weight: 700; }
    .s { font-size: 14px; }
    .tag { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .wip { fill: #e6b85c; }
      .axis { stroke: #4cc293; }
      .axis-next { stroke: #6b767d; }
      .tick { stroke: #3a4247; }
      .dot { fill: #1b1f22; stroke: #4cc293; }
      .dot-now { fill: #4cc293; }
      .dot-next { fill: #1b1f22; stroke: #6b767d; }
      .pill { fill: #173229; }
      .pill-wip { fill: #33291a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="330"/>

  <line class="axis" x1="40" y1="165" x2="760" y2="165"/>
  <line class="axis-next" x1="760" y1="165" x2="930" y2="165"/>

  <!-- 1: ESPR -->
  <line class="tick" x1="80" y1="165" x2="80" y2="100"/>
  <circle class="dot" cx="80" cy="165" r="9"/>
  <text class="date accent" x="80" y="40" text-anchor="middle">Jul 2024</text>
  <text class="s ink" x="80" y="62" text-anchor="middle">ESPR enters</text>
  <text class="s ink" x="80" y="80" text-anchor="middle">into force</text>

  <!-- 2: working plan -->
  <line class="tick" x1="230" y1="165" x2="230" y2="230"/>
  <circle class="dot" cx="230" cy="165" r="9"/>
  <text class="date accent" x="230" y="252" text-anchor="middle">Apr 2025</text>
  <text class="s ink" x="230" y="274" text-anchor="middle">Working plan names</text>
  <text class="s ink" x="230" y="292" text-anchor="middle">first product groups</text>

  <!-- 3: standards -->
  <line class="tick" x1="390" y1="165" x2="390" y2="100"/>
  <circle class="dot" cx="390" cy="165" r="9"/>
  <text class="date accent" x="390" y="40" text-anchor="middle">Jul 2026</text>
  <text class="s ink" x="390" y="62" text-anchor="middle">Six harmonised</text>
  <text class="s ink" x="390" y="80" text-anchor="middle">standards cited</text>

  <!-- 4: registry -->
  <line class="tick" x1="520" y1="165" x2="520" y2="230"/>
  <circle class="dot" cx="520" cy="165" r="9"/>
  <text class="date accent" x="520" y="252" text-anchor="middle">Jul 2026</text>
  <text class="s ink" x="520" y="274" text-anchor="middle">EU DPP registry</text>
  <text class="s ink" x="520" y="292" text-anchor="middle">goes live</text>

  <!-- 5: battery -->
  <line class="tick" x1="690" y1="165" x2="690" y2="110"/>
  <circle class="dot dot-now" cx="690" cy="165" r="11"/>
  <rect class="pill" x="634" y="18" width="112" height="22" rx="11"/>
  <text class="tag accent" x="690" y="34" text-anchor="middle">FIRST PASSPORT</text>
  <text class="date accent" x="690" y="62" text-anchor="middle">18 Feb 2027</text>
  <text class="s ink" x="690" y="82" text-anchor="middle">Battery passport</text>
  <text class="s ink" x="690" y="100" text-anchor="middle">mandatory</text>

  <!-- 6: next -->
  <line class="tick" x1="850" y1="165" x2="850" y2="230"/>
  <circle class="dot-next" cx="850" cy="165" r="9"/>
  <rect class="pill-wip" x="808" y="238" width="84" height="22" rx="11"/>
  <text class="tag wip" x="850" y="254" text-anchor="middle">NEXT</text>
  <text class="s ink" x="850" y="280" text-anchor="middle">One delegated act</text>
  <text class="s ink" x="850" y="298" text-anchor="middle">per product group,</text>
  <text class="s muted" x="850" y="316" text-anchor="middle">iron and steel first</text>
</svg>
