<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How an ESPR delegated act comes about</title>
  <desc id="d">Six steps: the working plan sets the order; a preparatory study by the Joint Research Centre works out the requirements; a call for evidence and public consultation collect feedback; the Ecodesign Forum and Member State experts discuss the draft; the Commission adopts the act and Parliament and Council may object within two months, extendable by two; the act applies at the earliest 18 months after it enters into force, and from then on passports are mandatory. As of October 2026, iron and steel has passed the consultation; the other product groups are in the preparatory study.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .done { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.5; }
    .end { fill: #0b6e4f; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .wip { fill: #8a5a00; }
    .chev { fill: #c9d0d4; }
    .pin { fill: #fbf0d9; stroke: #8a5a00; stroke-width: 1.3; }
    .stem { stroke: #8a5a00; stroke-width: 1.5; }
    .on { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .n { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .h { font-size: 14.5px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .p { font-size: 12.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .done { fill: #173229; stroke: #4cc293; }
      .end { fill: #4cc293; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .wip { fill: #e6b85c; }
      .chev { fill: #3a4247; }
      .pin { fill: #33291a; stroke: #e6b85c; }
      .stem { stroke: #e6b85c; }
      .on { fill: #121517; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="330"/>

  <!-- step 1 -->
  <rect class="done" x="20" y="30" width="138" height="150" rx="12"/>
  <text class="n accent" x="34" y="54">STEP 1</text>
  <text class="h ink" x="34" y="76">Working plan</text>
  <text class="s muted" x="34" y="98">sets the order of</text>
  <text class="s muted" x="34" y="114">product groups</text>
  <text class="s muted" x="34" y="136">2025–2030, review</text>
  <text class="s muted" x="34" y="152">in 2028</text>
  <path class="chev" d="M162,98 l10,7 l-10,7 z"/>

  <!-- step 2 -->
  <rect class="box" x="176" y="30" width="138" height="150" rx="12"/>
  <text class="n accent" x="190" y="54">STEP 2</text>
  <text class="h ink" x="190" y="76">Preparatory</text>
  <text class="h ink" x="190" y="94">study</text>
  <text class="s muted" x="190" y="116">by the Joint</text>
  <text class="s muted" x="190" y="132">Research Centre,</text>
  <text class="s muted" x="190" y="148">with stakeholder</text>
  <text class="s muted" x="190" y="164">meetings</text>
  <path class="chev" d="M318,98 l10,7 l-10,7 z"/>

  <!-- step 3 -->
  <rect class="box" x="332" y="30" width="138" height="150" rx="12"/>
  <text class="n accent" x="346" y="54">STEP 3</text>
  <text class="h ink" x="346" y="76">Consultation</text>
  <text class="s muted" x="346" y="98">call for evidence</text>
  <text class="s muted" x="346" y="114">and public</text>
  <text class="s muted" x="346" y="130">consultation on</text>
  <text class="s muted" x="346" y="146">"Have your say"</text>
  <path class="chev" d="M474,98 l10,7 l-10,7 z"/>

  <!-- step 4 -->
  <rect class="box" x="488" y="30" width="138" height="150" rx="12"/>
  <text class="n accent" x="502" y="54">STEP 4</text>
  <text class="h ink" x="502" y="76">Draft</text>
  <text class="s muted" x="502" y="98">discussed in the</text>
  <text class="s muted" x="502" y="114">Ecodesign Forum</text>
  <text class="s muted" x="502" y="130">and with Member</text>
  <text class="s muted" x="502" y="146">State experts</text>
  <path class="chev" d="M630,98 l10,7 l-10,7 z"/>

  <!-- step 5 -->
  <rect class="box" x="644" y="30" width="138" height="150" rx="12"/>
  <text class="n accent" x="658" y="54">STEP 5</text>
  <text class="h ink" x="658" y="76">Adoption</text>
  <text class="s muted" x="658" y="98">by the Commission;</text>
  <text class="s muted" x="658" y="114">Parliament and</text>
  <text class="s muted" x="658" y="130">Council may object</text>
  <text class="s muted" x="658" y="146">within 2 (+2) months</text>
  <path class="chev" d="M786,98 l10,7 l-10,7 z"/>

  <!-- step 6 -->
  <rect class="end" x="800" y="30" width="140" height="150" rx="12"/>
  <text class="n on" x="814" y="54">STEP 6</text>
  <text class="h on" x="814" y="76">Application</text>
  <text class="s on" x="814" y="98">at the earliest</text>
  <text class="s on" x="814" y="114">18 months after</text>
  <text class="s on" x="814" y="130">entry into force –</text>
  <text class="s on" x="814" y="146">passports become</text>
  <text class="s on" x="814" y="162">mandatory</text>

  <!-- where the groups stand -->
  <line class="stem" x1="245" y1="182" x2="245" y2="222"/>
  <rect class="pin" x="150" y="222" width="300" height="84" rx="10"/>
  <text class="p wip" x="166" y="246">October 2026: preparatory study</text>
  <text class="s ink" x="166" y="268">textiles and apparel, tyres, aluminium,</text>
  <text class="s ink" x="166" y="286">furniture, mattresses</text>

  <line class="stem" x1="500" y1="182" x2="560" y2="222"/>
  <rect class="pin" x="476" y="222" width="300" height="84" rx="10"/>
  <text class="p wip" x="492" y="246">October 2026: iron and steel</text>
  <text class="s ink" x="492" y="268">consultation closed 12 August 2026;</text>
  <text class="s ink" x="492" y="286">adoption expected in Q4 2026</text>
</svg>
