<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Changing the custodian without reprinting the carrier</title>
  <desc id="d">The data carrier on the product keeps its link on the economic operator's own domain. When the passport moves to a new custodian, the operator changes one DNS record in its own zone, and a signed entry in the passport identifier's log names the new service endpoint. Nothing on the product changes.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .new { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .old { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .gone { stroke: #8a959c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
    .qr { fill: #1d2327; }
    .qrbg { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 14px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .lbl { font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .new { fill: #173229; stroke: #4cc293; }
      .old { fill: #121517; stroke: #3a4247; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
      .gone { stroke: #6b767d; }
      .qr { fill: #e8ebed; }
      .qrbg { fill: #1b1f22; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="340"/>

  <!-- product -->
  <rect class="box" x="20" y="60" width="230" height="200" rx="14"/>
  <text class="h ink" x="40" y="90">On the product</text>
  <g transform="translate(40,108)">
    <rect class="qr" x="0" y="0" width="18" height="18"/><rect class="qrbg" x="4" y="4" width="10" height="10"/>
    <rect class="qr" x="40" y="0" width="18" height="18"/><rect class="qrbg" x="44" y="4" width="10" height="10"/>
    <rect class="qr" x="0" y="40" width="18" height="18"/><rect class="qrbg" x="4" y="44" width="10" height="10"/>
    <rect class="qr" x="24" y="6" width="5" height="5"/><rect class="qr" x="30" y="24" width="5" height="5"/>
    <rect class="qr" x="44" y="30" width="5" height="5"/><rect class="qr" x="26" y="44" width="5" height="5"/>
    <rect class="qr" x="50" y="48" width="5" height="5"/><rect class="qr" x="8" y="26" width="5" height="5"/>
  </g>
  <text class="m ink" x="40" y="196">https://p.lumina.at/</text>
  <text class="m ink" x="40" y="214">01/…/21/000123</text>
  <text class="s accent" x="40" y="242">never changes</text>

  <!-- DNS -->
  <rect class="box" x="300" y="60" width="250" height="200" rx="14"/>
  <text class="h ink" x="320" y="90">Operator's DNS zone</text>
  <text class="m ink" x="320" y="122">p.lumina.at</text>
  <text class="s muted" x="320" y="146">one record, changed by</text>
  <text class="s muted" x="320" y="166">the economic operator</text>
  <text class="s muted" x="320" y="198">the custodian needs a</text>
  <text class="s muted" x="320" y="218">certificate for this name</text>
  <text class="s muted" x="320" y="238">before the switch</text>
  <line class="line" x1="252" y1="160" x2="296" y2="160" marker-end="url(#a)"/>

  <!-- custodians -->
  <rect class="old" x="610" y="40" width="330" height="80" rx="14"/>
  <text class="h muted" x="630" y="70">Previous custodian</text>
  <text class="s muted" x="630" y="96">released after the switch</text>
  <rect class="new" x="610" y="200" width="330" height="80" rx="14"/>
  <text class="h ink" x="630" y="230">New custodian</text>
  <text class="s muted" x="630" y="256">serves the passport from now on</text>
  <path class="gone" d="M552,130 C580,110 590,90 606,84"/>
  <path class="line" d="M552,190 C580,210 590,236 606,240" marker-end="url(#a)"/>
  <text class="lbl accent" x="560" y="182">DNS</text>

  <!-- DID log -->
  <text class="s ink" x="300" y="300">Passport identifier: a signed log entry names the new</text>
  <text class="s ink" x="300" y="320"><tspan class="m">serviceEndpoint</tspan> – the record of who holds the passport.</text>
</svg>
