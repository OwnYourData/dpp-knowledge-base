<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">One set of criteria, two tools</title>
  <desc id="d">The open repository dpp-criteria holds the criteria and the list of DPP services. The DPP Linter applies the passport criteria to one passport, on demand. The DPP Service Validator applies the service criteria to every listed DPP service, every day, and publishes the results. Anyone can propose criteria, and operators add their own service, by pull request.</desc>
  <style>
    .bg { fill: #ffffff; }
    .repo { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; }
    .tool { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .pr { fill: #fbf0d9; stroke: #8a5a00; stroke-width: 1.4; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .wip { fill: #8a5a00; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .pline { stroke: #8a5a00; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; }
    .lbl { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .repo { fill: #121517; stroke: #3a4247; }
      .tool { fill: #173229; stroke: #4cc293; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .pr { fill: #33291a; stroke: #e6b85c; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .wip { fill: #e6b85c; }
      .line { stroke: #4cc293; }
      .pline { stroke: #e6b85c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="400"/>

  <!-- repo -->
  <rect class="repo" x="330" y="20" width="300" height="130" rx="14"/>
  <text class="lbl muted" x="350" y="46">OPEN REPOSITORY</text>
  <text class="h ink" x="350" y="72">dpp-criteria</text>
  <text class="s muted" x="350" y="96">passport criteria · service criteria</text>
  <text class="s muted" x="350" y="116">list of checked DPP services</text>
  <text class="s muted" x="350" y="136">each criterion with its source</text>

  <!-- pull requests -->
  <rect class="pr" x="700" y="40" width="240" height="90" rx="12"/>
  <text class="p wip" x="718" y="66">Pull requests</text>
  <text class="s ink" x="718" y="88">propose or improve a criterion,</text>
  <text class="s ink" x="718" y="106">add your own DPP service</text>
  <line class="pline" x1="698" y1="85" x2="634" y2="85"/>

  <!-- tools -->
  <rect class="tool" x="40" y="200" width="380" height="80" rx="14"/>
  <text class="h ink" x="60" y="230">DPP Linter</text>
  <text class="s muted" x="60" y="254">passport criteria, on demand</text>
  <rect class="tool" x="540" y="200" width="380" height="80" rx="14"/>
  <text class="h ink" x="560" y="230">DPP Service Validator</text>
  <text class="s muted" x="560" y="254">service criteria, every day</text>
  <path class="line" d="M400,152 C380,175 300,180 240,196" marker-end="url(#a)"/>
  <path class="line" d="M560,152 C580,175 660,180 720,196" marker-end="url(#a)"/>

  <!-- targets -->
  <rect class="box" x="40" y="310" width="380" height="74" rx="12"/>
  <text class="p ink" x="60" y="338">One passport</text>
  <text class="s muted" x="60" y="360">behind the link on a product</text>
  <rect class="box" x="540" y="310" width="380" height="74" rx="12"/>
  <text class="p ink" x="560" y="338">Every listed DPP service</text>
  <text class="s muted" x="560" y="360">its API, transport and protection – results published</text>
  <line class="line" x1="230" y1="282" x2="230" y2="306" marker-end="url(#a)"/>
  <line class="line" x1="730" y1="282" x2="730" y2="306" marker-end="url(#a)"/>
</svg>
