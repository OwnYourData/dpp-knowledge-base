<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Three ways to the same passport</title>
  <desc id="d">Scanning the product leads through the economic operator's domain, pointed at the custodian by DNS. A DPP service reads the passport from the custodian by its product identifier. Resolving the passport identifier yields a service endpoint at the custodian. All three return the same public part, as a readable page for a browser or as JSON for software. The DID document of the passport also carries a hash of the JSON the custodian serves.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .cust { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .soft { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .dash { stroke: #8a959c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
    .num { fill: #0b6e4f; }
    .numt { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 14px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .lbl { font-size: 13px; font-weight: 600; }
    .n { font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .cust { fill: #173229; stroke: #4cc293; }
      .soft { fill: #121517; stroke: #3a4247; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
      .dash { stroke: #6b767d; }
      .num { fill: #4cc293; }
      .numt { fill: #121517; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <!-- entry 1 -->
  <rect class="box" x="20" y="20" width="330" height="110" rx="14"/>
  <circle class="num" cx="44" cy="46" r="12"/><text class="n numt" x="44" y="51" text-anchor="middle">1</text>
  <text class="h ink" x="66" y="52">Scan the product</text>
  <text class="m ink" x="40" y="80">https://dpp.oydapp.eu/01/</text>
  <text class="m ink" x="40" y="98">09520123456788/21/000002</text>
  <text class="s muted" x="40" y="120">for people, with any phone camera</text>

  <!-- entry 2 -->
  <rect class="box" x="20" y="150" width="330" height="110" rx="14"/>
  <circle class="num" cx="44" cy="176" r="12"/><text class="n numt" x="44" y="181" text-anchor="middle">2</text>
  <text class="h ink" x="66" y="182">Ask a DPP service</text>
  <text class="m ink" x="40" y="210">GET /dpp/v1/dppsByProductId/</text>
  <text class="m ink" x="40" y="228">    {product identifier}</text>
  <text class="s muted" x="40" y="250">for software, EN 18222 API</text>

  <!-- entry 3 -->
  <rect class="box" x="20" y="280" width="330" height="110" rx="14"/>
  <circle class="num" cx="44" cy="306" r="12"/><text class="n numt" x="44" y="311" text-anchor="middle">3</text>
  <text class="h ink" x="66" y="312">Resolve the passport identifier</text>
  <text class="m ink" x="40" y="340">did:oyd:zQmZh7YHUtLVopt…</text>
  <text class="s muted" x="40" y="362">its DID document names where</text>
  <text class="s muted" x="40" y="380">the passport is served</text>

  <!-- arrows to custodian -->
  <path class="line" d="M352,75 C430,75 440,170 506,182" marker-end="url(#a)"/>
  <text class="lbl accent" x="390" y="66">DNS, no redirect</text>
  <line class="line" x1="352" y1="205" x2="506" y2="205" marker-end="url(#a)"/>
  <text class="lbl accent" x="380" y="196">reads there</text>
  <path class="line" d="M352,335 C430,335 440,240 506,228" marker-end="url(#a)"/>
  <text class="lbl accent" x="380" y="356">serviceEndpoint</text>

  <!-- custodian -->
  <rect class="cust" x="510" y="130" width="200" height="150" rx="16"/>
  <text class="h ink" x="530" y="162">Custodian</text>
  <text class="s ink" x="530" y="190">public part of the</text>
  <text class="s ink" x="530" y="210">passport – no account,</text>
  <text class="s ink" x="530" y="230">no app, no token</text>
  <text class="s muted" x="530" y="262">same passport on every path</text>

  <!-- outputs -->
  <line class="line" x1="712" y1="178" x2="776" y2="110" marker-end="url(#a)"/>
  <line class="line" x1="712" y1="232" x2="776" y2="300" marker-end="url(#a)"/>
  <rect class="box" x="780" y="40" width="160" height="110" rx="14"/>
  <text class="h ink" x="798" y="70">Browser</text>
  <text class="s muted" x="798" y="96">a readable page</text>
  <text class="s muted" x="798" y="118">Accept:</text>
  <text class="m muted" x="798" y="136">text/html</text>
  <rect class="box" x="780" y="250" width="160" height="110" rx="14"/>
  <text class="h ink" x="798" y="280">Software</text>
  <text class="s muted" x="798" y="306">JSON, EN 18223</text>
  <text class="s muted" x="798" y="328">Accept:</text>
  <text class="m muted" x="798" y="346">application/json</text>

  <!-- integrity -->
  <rect class="soft" x="380" y="410" width="560" height="90" rx="14"/>
  <text class="h ink" x="400" y="440">Check what you received</text>
  <text class="s muted" x="400" y="464">The passport's DID document carries a hash of the JSON the custodian serves.</text>
  <text class="s muted" x="400" y="484">Anyone can compare – without trusting the custodian.</text>
  <line class="dash" x1="610" y1="282" x2="610" y2="408"/>
</svg>
