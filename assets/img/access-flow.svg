<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">How role-based access works in the DPP Service</title>
  <desc id="d">Step 1: the economic operator registers an access policy per product type and writes passports. The DPP Service splits each passport into a public card, served to anyone, and a controlled card, which only the DPP Service reads. Step 2: the operator signs an access grant for a reader's DID. Step 3: readers ask the DPP Service. A reader without a grant gets the public part; a reader with a grant also gets the classes it holds. Every read of controlled data is logged.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .svc { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .pill { fill: #ffffff; stroke: #b9e0cf; stroke-width: 1.2; }
    .card-pub { fill: #ffffff; stroke: #0b6e4f; stroke-width: 1.5; }
    .card-ctl { fill: #fbf0d9; stroke: #8a5a00; stroke-width: 1.5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .wip { fill: #8a5a00; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .dash { stroke: #8a5a00; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .num { fill: #0b6e4f; }
    .numt { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 17px; font-weight: 700; }
    .p { font-size: 15px; font-weight: 600; }
    .s { font-size: 14px; }
    .lbl { font-size: 14px; font-weight: 600; }
    .n { font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .svc { fill: #173229; stroke: #4cc293; }
      .pill { fill: #1b1f22; stroke: #2a6049; }
      .card-pub { fill: #1b1f22; stroke: #4cc293; }
      .card-ctl { fill: #33291a; stroke: #e6b85c; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .wip { fill: #e6b85c; }
      .line { stroke: #4cc293; }
      .dash { stroke: #e6b85c; }
      .num { fill: #4cc293; }
      .numt { fill: #121517; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <!-- economic operator -->
  <rect class="box" x="20" y="40" width="210" height="150" rx="14"/>
  <text class="h ink" x="40" y="72">Economic operator</text>
  <text class="s muted" x="40" y="98">owns the passports and</text>
  <text class="s muted" x="40" y="117">decides who reads what,</text>
  <text class="s muted" x="40" y="136">e.g. with the DPP Manager</text>
  <text class="s muted" x="40" y="155">on its own computer</text>

  <!-- arrows operator -> service -->
  <line class="line" x1="232" y1="88" x2="336" y2="88" marker-end="url(#a)"/>
  <circle class="num" cx="256" cy="66" r="12"/><text class="n numt" x="256" y="71" text-anchor="middle">1</text>
  <text class="lbl accent" x="274" y="71">policy</text>
  <line class="line" x1="232" y1="160" x2="336" y2="160" marker-end="url(#a)"/>
  <circle class="num" cx="256" cy="138" r="12"/><text class="n numt" x="256" y="143" text-anchor="middle">2</text>
  <text class="lbl accent" x="274" y="143">grant</text>

  <!-- DPP service -->
  <rect class="svc" x="340" y="20" width="300" height="330" rx="16"/>
  <text class="h ink" x="360" y="52">DPP Service</text>
  <rect class="pill" x="360" y="70" width="260" height="70" rx="10"/>
  <text class="p ink" x="376" y="96">Access policies</text>
  <text class="s muted" x="376" y="118">one per product type, never edited</text>
  <rect class="pill" x="360" y="152" width="260" height="70" rx="10"/>
  <text class="p ink" x="376" y="178">Access grants</text>
  <text class="s muted" x="376" y="200">signed, at most a year, revocable</text>
  <rect class="pill" x="360" y="234" width="260" height="96" rx="10"/>
  <text class="p ink" x="376" y="260">Access log</text>
  <text class="s muted" x="376" y="282">every read of controlled data,</text>
  <text class="s muted" x="376" y="302">append-only, kept five years,</text>
  <text class="s muted" x="376" y="322">visible to the owner</text>

  <!-- service -> custodian -->
  <line class="line" x1="642" y1="110" x2="726" y2="110" marker-end="url(#a)"/>
  <text class="lbl accent" x="652" y="100">writes</text>
  <line class="line" x1="726" y1="250" x2="642" y2="250" marker-end="url(#a)"/>
  <text class="lbl accent" x="652" y="240">reads</text>

  <!-- custodian -->
  <rect class="box" x="730" y="20" width="210" height="330" rx="16"/>
  <text class="h ink" x="748" y="52">Custodian</text>
  <rect class="card-pub" x="748" y="68" width="174" height="110" rx="10"/>
  <text class="p ink" x="762" y="94">Public card</text>
  <text class="s muted" x="762" y="116">header and public</text>
  <text class="s muted" x="762" y="135">attributes, served</text>
  <text class="s muted" x="762" y="154">to anyone</text>
  <line class="dash" x1="835" y1="180" x2="835" y2="212"/>
  <text class="s wip" x="843" y="201">hash</text>
  <rect class="card-ctl" x="748" y="214" width="174" height="118" rx="10"/>
  <text class="p ink" x="762" y="240">Controlled card</text>
  <text class="s muted" x="762" y="262">all other attributes,</text>
  <text class="s muted" x="762" y="281">read only by the</text>
  <text class="s muted" x="762" y="300">DPP Service under</text>
  <text class="s muted" x="762" y="319">its own read grant</text>

  <!-- readers -->
  <rect class="box" x="250" y="410" width="230" height="96" rx="14"/>
  <text class="h ink" x="268" y="440">Anyone</text>
  <text class="s muted" x="268" y="464">no token or no grant</text>
  <text class="s accent" x="268" y="488">→ gets the public part</text>

  <rect class="box" x="500" y="410" width="250" height="96" rx="14"/>
  <text class="h ink" x="518" y="440">Repair shop</text>
  <text class="s muted" x="518" y="464">token + grant for its DID</text>
  <text class="s accent" x="518" y="488">→ public + legitimate interest</text>

  <line class="line" x1="400" y1="408" x2="440" y2="354" marker-end="url(#a)"/>
  <line class="line" x1="600" y1="408" x2="560" y2="354" marker-end="url(#a)"/>
  <circle class="num" cx="500" cy="384" r="12"/><text class="n numt" x="500" y="389" text-anchor="middle">3</text>
  <text class="lbl accent" x="518" y="389">read</text>
</svg>
