<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How the DPP Linter checks a passport</title>
  <desc id="d">The DPP Linter takes a product identifier, retrieves the passport the way a phone would, without credentials, and checks it against the open criteria of the dpp-criteria repository: the data model with SHACL shapes via SOyA, the identifiers via didlint, and the integrity proofs and payload hash. Each criterion ends as passed, warning, failed or skipped with a reason. The results are automated checks, not a certification.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .lint { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .chk { fill: #ffffff; stroke: #b9e0cf; stroke-width: 1.2; }
    .crit { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .dash { stroke: #8a959c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
    .ok { fill: #1e7b3c; } .warn { fill: #9a6200; } .fail { fill: #b42318; } .skip { fill: #6b7280; }
    .pt { fill: #ffffff; font-size: 12.5px; font-weight: 700; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .lint { fill: #173229; stroke: #4cc293; }
      .chk { fill: #1b1f22; stroke: #2a6049; }
      .crit { fill: #121517; stroke: #3a4247; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
      .dash { stroke: #6b767d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="440"/>

  <!-- criteria -->
  <rect class="crit" x="290" y="16" width="380" height="70" rx="12"/>
  <text class="p ink" x="310" y="42">Open criteria: dpp-criteria</text>
  <text class="s muted" x="310" y="64">one file per criterion – anyone can propose a change</text>
  <line class="dash" x1="480" y1="88" x2="480" y2="118"/>

  <!-- input -->
  <rect class="box" x="20" y="150" width="220" height="120" rx="14"/>
  <text class="h ink" x="40" y="180">Product identifier</text>
  <text class="s muted" x="40" y="204">the link from the</text>
  <text class="s muted" x="40" y="222">QR code, e.g.</text>
  <text class="m ink" x="40" y="248">dpp.oydapp.eu/01/…</text>
  <line class="line" x1="242" y1="210" x2="286" y2="210" marker-end="url(#a)"/>

  <!-- linter -->
  <rect class="lint" x="290" y="120" width="380" height="290" rx="16"/>
  <text class="h ink" x="310" y="150">DPP Linter</text>
  <rect class="chk" x="310" y="164" width="340" height="52" rx="10"/>
  <text class="p ink" x="326" y="186">Retrieve like a phone</text>
  <text class="s muted" x="326" y="205">plain HTTPS, no account – as JSON and as HTML</text>
  <rect class="chk" x="310" y="224" width="340" height="52" rx="10"/>
  <text class="p ink" x="326" y="246">Data model</text>
  <text class="s muted" x="326" y="265">EN 18223, checked with SHACL shapes in SOyA</text>
  <rect class="chk" x="310" y="284" width="340" height="52" rx="10"/>
  <text class="p ink" x="326" y="306">Identifiers</text>
  <text class="s muted" x="326" y="325">EN 18219 schemes; DIDs checked by didlint</text>
  <rect class="chk" x="310" y="344" width="340" height="52" rx="10"/>
  <text class="p ink" x="326" y="366">Integrity</text>
  <text class="s muted" x="326" y="385">proofs and the hash in the passport's DID</text>
  <line class="line" x1="672" y1="265" x2="716" y2="265" marker-end="url(#a)"/>

  <!-- results -->
  <rect class="box" x="720" y="150" width="220" height="230" rx="14"/>
  <text class="h ink" x="740" y="180">Per criterion</text>
  <rect class="ok" x="740" y="196" width="72" height="24" rx="12"/><text class="pt" x="776" y="213" text-anchor="middle">passed</text>
  <rect class="warn" x="740" y="230" width="72" height="24" rx="12"/><text class="pt" x="776" y="247" text-anchor="middle">warning</text>
  <rect class="fail" x="740" y="264" width="72" height="24" rx="12"/><text class="pt" x="776" y="281" text-anchor="middle">failed</text>
  <rect class="skip" x="740" y="298" width="72" height="24" rx="12"/><text class="pt" x="776" y="315" text-anchor="middle">skipped</text>
  <text class="s muted" x="822" y="315">+ the reason</text>
  <text class="s muted" x="740" y="350">automated checks –</text>
  <text class="s muted" x="740" y="368">not a certification</text>
</svg>
