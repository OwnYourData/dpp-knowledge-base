<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Bound writes and the write log</title><desc id="d">From 1 December 2026, a write without rqh is refused; until then the answer carries X-DPP-Request-Binding: missing. 1 Token: the writer signs it with the key of its own DID, audience this service, at most 15 minutes, jti accepted once, and rqh over method, target and body. 2 Request: the DPP Service compares rqh with the request before anything happens; a token for another request or no token is answered with 401 and WWW-Authenticate. 3 Write log: an entry request before the change, an entry outcome when it ends, only ever added to; without the entry there is no change; kept ten years by default. 4 Check: the owner gets an export from the operator and checks it with bin/verify_writes: token, key, rqh and lifetime, no jti twice, no version without a write. rqh is base64url of SHA-256 over method, target and the base64url SHA-256 of the body. The log holds the spent token, rqh and the digest of the body, never the content. Reads need no rqh; every token is valid for one call only.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.band1{fill:#e3f2ec}.band2{fill:#fbf0d9}.band3{fill:#e7edf7}.band4{fill:#f3e8f7}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.chip.key{stroke:#0b6e4f;stroke-width:1.6}
.chip.plan{fill:none;stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.tag{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.span{fill:none;stroke:#8a959c;stroke-width:1.4;stroke-dasharray:6 4}
.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}
.s{font-size:13px}.c{font-size:13px;font-weight:600}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.band1{fill:#173229}.band2{fill:#33291a}.band3{fill:#1d2635}.band4{fill:#2c2033}
.chip{fill:#1b1f22;stroke:#6b767d}.chip.key{stroke:#4cc293}.chip.plan{fill:none}
.box{fill:#1b1f22;stroke:#3a4247}.tag{fill:#173229;stroke:#4cc293}.span{stroke:#6b767d}.line{stroke:#4cc293}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="430"/>
<rect class="band2" x="20" y="16" width="920" height="46" rx="10"/>
<text class="h ink" x="40" y="45">From 1 December 2026, a write without rqh is refused.</text>
<text class="s muted" x="520" y="45">Until then: X-DPP-Request-Binding: missing</text>
<rect class="box" x="20" y="80" width="212" height="250" rx="12"/>
<text class="h ink" x="36" y="110">1  Token</text>
<rect class="tag" x="36" y="122" width="97" height="26" rx="13"/><text class="c ink" x="84" y="140" text-anchor="middle">the writer</text>
<text class="s muted" x="36" y="178">signed with its own DID key</text>
<text class="s muted" x="36" y="202">aud: this service</text>
<text class="s muted" x="36" y="226">exp: at most 15 minutes</text>
<text class="s muted" x="36" y="250">jti: accepted once</text>
<text class="s muted" x="36" y="274">rqh: method, target, body</text>
<line class="line" x1="234" y1="205" x2="254" y2="205" marker-end="url(#a)"/>
<rect class="box" x="256" y="80" width="212" height="250" rx="12"/>
<text class="h ink" x="272" y="110">2  Request</text>
<rect class="tag" x="272" y="122" width="104" height="26" rx="13"/><text class="c ink" x="324" y="140" text-anchor="middle">DPP Service</text>
<text class="s muted" x="272" y="178">compares rqh with the</text>
<text class="s muted" x="272" y="202">request before anything</text>
<text class="s muted" x="272" y="226">happens</text>
<text class="s muted" x="272" y="250">another request: 401</text>
<text class="s muted" x="272" y="274">no token: 401, WWW-Auth.</text>
<line class="line" x1="470" y1="205" x2="490" y2="205" marker-end="url(#a)"/>
<rect class="box" x="492" y="80" width="212" height="250" rx="12"/>
<text class="h ink" x="508" y="110">3  Write log</text>
<rect class="tag" x="508" y="122" width="104" height="26" rx="13"/><text class="c ink" x="560" y="140" text-anchor="middle">DPP Service</text>
<text class="s muted" x="508" y="178">request: before the change</text>
<text class="s muted" x="508" y="202">outcome: when it ends</text>
<text class="s muted" x="508" y="226">only ever added to</text>
<text class="s muted" x="508" y="250">no entry, no change (500)</text>
<text class="s muted" x="508" y="274">kept ten years by default</text>
<line class="line" x1="706" y1="205" x2="726" y2="205" marker-end="url(#a)"/>
<rect class="box" x="728" y="80" width="212" height="250" rx="12"/>
<text class="h ink" x="744" y="110">4  Check</text>
<rect class="tag" x="744" y="122" width="90" height="26" rx="13"/><text class="c ink" x="789" y="140" text-anchor="middle">the owner</text>
<text class="s muted" x="744" y="178">export from the operator</text>
<text class="s muted" x="744" y="202">bin/verify_writes</text>
<text class="s muted" x="744" y="226">token, key, rqh, lifetime</text>
<text class="s muted" x="744" y="250">no jti twice</text>
<text class="s muted" x="744" y="274">no version without a write</text>
<text class="s muted" x="20" y="362">rqh = base64url( SHA-256( METHOD LF TARGET LF base64url( SHA-256( BODY ) ) ) )</text>
<text class="s muted" x="20" y="390">The log holds the spent token, rqh and the digest of the body – never the content. Versions are archived separately.</text>
<text class="s muted" x="20" y="414">Reads need no rqh. Every token, also for reads with access rights, is valid for one call only.</text>
</svg>