<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The criteria in numbers</title><desc id="d">47 criteria: 23 for passports, checked by the DPP Linter; 23 for services, checked by the DPP Service Validator; 1 for the economic operator, by self-declaration only. 21 are active and count, 26 are proposed. Check types: http 17, shacl 13, resolve 5, tls 4, declaration 3, proof 2, did, links and html 1 each.</desc>
