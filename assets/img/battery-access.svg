<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" width="960" height="435" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Who may read which part of a battery passport</title><desc id="d">Annex XIII of the Battery Regulation in four points. Point 1, battery model, public: for example manufacturer, model, chemistry, capacity, hazardous substances, carbon footprint and declaration of conformity – anyone who scans the QR code; class public in the DPP Service. Point 2, battery model, restricted: detailed composition, part numbers, dismantling information, safety measures – persons with a legitimate interest, and notified bodies, market surveillance authorities and the Commission; class legitimate interest, which readers of the authority class also see. Point 3, compliance: test reports – notified bodies, market surveillance authorities and the Commission; class authority. Point 4, individual battery over time: state of health, status, charge cycles, negative events – persons with a legitimate interest; class legitimate interest. Who has a legitimate interest is to be set by an implementing act, due 18 August 2026 and not adopted yet.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.card{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.6}.no{fill:none;stroke:#8a959c;stroke-width:1.3;stroke-dasharray:6 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.strip{fill:#f0f2f1}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.cls{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.num{fill:#0b6e4f}.numt{fill:#ffffff}.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}.sep{stroke:#e2e5e8;stroke-width:1}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}.s{font-size:13px}.c{font-size:13px;font-weight:600}
.big{font-size:22px;font-weight:700}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.card{fill:#173229;stroke:#4cc293}.no{stroke:#6b767d}.box{fill:#1b1f22;stroke:#3a4247}.strip{fill:#22272b}
.chip{fill:#1b1f22;stroke:#6b767d}.cls{fill:#173229;stroke:#4cc293}.num{fill:#4cc293}.numt{fill:#121517}.line{stroke:#4cc293}.sep{stroke:#2c3236}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="435"/>
<text class="lbl muted" x="20" y="30">ANNEX XIII</text><text class="lbl muted" x="300" y="30">FOR EXAMPLE</text><text class="lbl muted" x="620" y="30">WHO MAY READ IT</text>
<line class="sep" x1="20" y1="46" x2="940" y2="46"/>
<circle class="num" cx="36" cy="74" r="13"/><text class="c numt" x="36" y="79" text-anchor="middle">1</text>
<text class="h ink" x="60" y="79">Battery model, public</text>
<text class="s muted" x="300" y="73">manufacturer, model, chemistry, capacity,</text>
<text class="s muted" x="300" y="92">hazardous substances, carbon footprint,</text>
<text class="s muted" x="300" y="111">declaration of conformity</text>
<text class="s ink" x="620" y="73">anyone who scans</text>
<text class="s ink" x="620" y="92">the QR code</text>
<text class="s accent" x="620" y="111">DPP Service class: public</text>
<line class="sep" x1="20" y1="128" x2="940" y2="128"/>
<circle class="num" cx="36" cy="156" r="13"/><text class="c numt" x="36" y="161" text-anchor="middle">2</text>
<text class="h ink" x="60" y="161">Battery model, restricted</text>
<text class="s muted" x="300" y="155">detailed composition, part numbers for</text>
<text class="s muted" x="300" y="174">spare parts, dismantling information,</text>
<text class="s muted" x="300" y="193">safety measures</text>
<text class="s ink" x="620" y="155">persons with a legitimate interest;</text>
<text class="s ink" x="620" y="174">notified bodies, market surveillance</text>
<text class="s ink" x="620" y="193">authorities and the Commission</text>
<text class="s accent" x="620" y="212">DPP Service class: legitimate interest</text>
<line class="sep" x1="20" y1="229" x2="940" y2="229"/>
<circle class="num" cx="36" cy="257" r="13"/><text class="c numt" x="36" y="262" text-anchor="middle">3</text>
<text class="h ink" x="60" y="262">Battery model, compliance</text>
<text class="s muted" x="300" y="256">test reports that prove compliance</text>
<text class="s ink" x="620" y="256">notified bodies, market</text>
<text class="s ink" x="620" y="275">surveillance, the Commission</text>
<text class="s accent" x="620" y="294">DPP Service class: authority</text>
<line class="sep" x1="20" y1="311" x2="940" y2="311"/>
<circle class="num" cx="36" cy="339" r="13"/><text class="c numt" x="36" y="344" text-anchor="middle">4</text>
<text class="h ink" x="60" y="344">Individual battery, over time</text>
<text class="s muted" x="300" y="338">state of health, status (original, repurposed,</text>
<text class="s muted" x="300" y="357">remanufactured, waste), charge cycles,</text>
<text class="s muted" x="300" y="376">negative events</text>
<text class="s ink" x="620" y="338">persons with a legitimate</text>
<text class="s ink" x="620" y="357">interest</text>
<text class="s accent" x="620" y="376">DPP Service class: legitimate interest</text>
<line class="sep" x1="20" y1="393" x2="940" y2="393"/>
<text class="s muted" x="20" y="419">Who counts as a person with a legitimate interest is to be set by an implementing act – due by 18 August 2026, not adopted yet.</text>
</svg>