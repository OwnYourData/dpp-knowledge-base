<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where the DPP Service sits</title>
  <desc id="d">Economic operators write passports to the DPP Service through the EN 18222 API, each request signed with their own did:oyd. The service checks the signature and the owner, applies access policies and grants, records an access log and binds the content to the passport identifier. It keeps the passports in its own database or at a custodian under a mandate signed by the operator. Anyone reads the public part without an account; readers with a grant also get the parts they are entitled to.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .svc { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.8; }
    .pill { fill: #ffffff; stroke: #b9e0cf; stroke-width: 1.2; }
    .store { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.3; fill: none; }
    .or { fill: #5b6770; font-size: 13px; font-weight: 700; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; }
    .lbl { font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .box { fill: #1b1f22; stroke: #3a4247; }
      .svc { fill: #173229; stroke: #4cc293; }
      .pill { fill: #1b1f22; stroke: #2a6049; }
      .store { fill: #121517; stroke: #3a4247; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
      .or { fill: #9aa5ad; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="460"/>

  <!-- writers -->
  <rect class="box" x="20" y="40" width="210" height="130" rx="14"/>
  <text class="h ink" x="40" y="70">Economic operator</text>
  <text class="s muted" x="40" y="94">DPP Manager or any</text>
  <text class="s muted" x="40" y="112">client of the API</text>
  <text class="s muted" x="40" y="140">signs each request with</text>
  <text class="s muted" x="40" y="158">its own did:oyd</text>
  <line class="line" x1="232" y1="105" x2="316" y2="105" marker-end="url(#a)"/>
  <text class="lbl accent" x="246" y="95">write</text>

  <!-- readers -->
  <rect class="box" x="20" y="250" width="210" height="150" rx="14"/>
  <text class="h ink" x="40" y="280">Readers</text>
  <text class="s muted" x="40" y="304">anyone: the public part,</text>
  <text class="s muted" x="40" y="322">no account needed</text>
  <text class="s muted" x="40" y="350">with a grant: also the</text>
  <text class="s muted" x="40" y="368">parts they may read</text>
  <line class="line" x1="316" y1="325" x2="232" y2="325" marker-end="url(#a)"/>
  <text class="lbl accent" x="250" y="315">read</text>

  <!-- service -->
  <rect class="svc" x="320" y="20" width="330" height="420" rx="18"/>
  <text class="h ink" x="342" y="52">DPP Service</text>
  <text class="s muted" x="342" y="74">EN 18222 API · passports per EN 18223</text>
  <rect class="pill" x="340" y="94" width="290" height="56" rx="10"/>
  <text class="p ink" x="356" y="117">Signature and owner</text>
  <text class="s muted" x="356" y="137">only the creator may change a passport</text>
  <rect class="pill" x="340" y="160" width="290" height="56" rx="10"/>
  <text class="p ink" x="356" y="183">Content binding</text>
  <text class="s muted" x="356" y="203">hash of the content in the passport's DID</text>
  <rect class="pill" x="340" y="226" width="290" height="56" rx="10"/>
  <text class="p ink" x="356" y="249">Access policies and grants</text>
  <text class="s muted" x="356" y="269">each reader gets what its class allows</text>
  <rect class="pill" x="340" y="292" width="290" height="56" rx="10"/>
  <text class="p ink" x="356" y="315">Access log</text>
  <text class="s muted" x="356" y="335">every read of controlled data</text>
  <rect class="pill" x="340" y="358" width="290" height="62" rx="10"/>
  <text class="p ink" x="356" y="381">Versions and end of life</text>
  <text class="s muted" x="356" y="401">earlier versions by date; final state kept</text>

  <!-- storage -->
  <line class="line" x1="652" y1="140" x2="716" y2="140" marker-end="url(#a)"/>
  <line class="line" x1="652" y1="320" x2="716" y2="320" marker-end="url(#a)"/>
  <rect class="store" x="720" y="80" width="220" height="120" rx="14"/>
  <text class="h ink" x="740" y="110">Own database</text>
  <text class="s muted" x="740" y="134">stand-alone operation,</text>
  <text class="s muted" x="740" y="152">PostgreSQL – nothing</text>
  <text class="s muted" x="740" y="170">else needed</text>
  <text class="or" x="830" y="236" text-anchor="middle">or</text>
  <rect class="store" x="720" y="260" width="220" height="140" rx="14"/>
  <text class="h ink" x="740" y="290">Custodian</text>
  <text class="s muted" x="740" y="314">under a mandate signed</text>
  <text class="s muted" x="740" y="332">by the operator – serves</text>
  <text class="s muted" x="740" y="350">the public part on the</text>
  <text class="s muted" x="740" y="368">link on the product</text>
</svg>
