<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="960" height="364" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Eight steps to the first passport</title><desc id="d">Set up once: 1 start the DPP Manager on your computer and choose a passphrase; 2 enter the address of the DPP service; 3 create an identity and write down its keys; 4 conclude an agreement with a data intermediary, which gives you a pod and a collection. Per passport: 5 describe the product in the form of its product type; 6 create the passport identifier; 7 submit to the DPP Service, the custodian keeps the passport; 8 open the link and check it with the DPP Linter.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.card{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.6}.no{fill:none;stroke:#8a959c;stroke-width:1.3;stroke-dasharray:6 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.strip{fill:#f0f2f1}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.cls{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.num{fill:#0b6e4f}.numt{fill:#ffffff}.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}.sep{stroke:#e2e5e8;stroke-width:1}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}.s{font-size:13px}.c{font-size:13px;font-weight:600}
.big{font-size:22px;font-weight:700}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.card{fill:#173229;stroke:#4cc293}.no{stroke:#6b767d}.box{fill:#1b1f22;stroke:#3a4247}.strip{fill:#22272b}
.chip{fill:#1b1f22;stroke:#6b767d}.cls{fill:#173229;stroke:#4cc293}.num{fill:#4cc293}.numt{fill:#121517}.line{stroke:#4cc293}.sep{stroke:#2c3236}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="364"/>
<text class="lbl muted" x="20" y="28">SET UP ONCE</text>
<rect class="card" x="20" y="40" width="210" height="112" rx="14"/>
<circle class="num" cx="44" cy="66" r="13"/><text class="c numt" x="44" y="71" text-anchor="middle">1</text>
<text class="h ink" x="66" y="71">Start</text>
<text class="s muted" x="38" y="100">install the container,</text>
<text class="s muted" x="38" y="119">choose a passphrase</text>
<text class="s accent" x="38" y="140">your computer</text>
<line class="line" x1="232" y1="96" x2="251" y2="96" marker-end="url(#a)"/>
<rect class="card" x="255" y="40" width="210" height="112" rx="14"/>
<circle class="num" cx="279" cy="66" r="13"/><text class="c numt" x="279" y="71" text-anchor="middle">2</text>
<text class="h ink" x="301" y="71">DPP service</text>
<text class="s muted" x="273" y="100">enter its address;</text>
<text class="s muted" x="273" y="119">it tells you the rest</text>
<text class="s accent" x="273" y="140">DPP Manager</text>
<line class="line" x1="467" y1="96" x2="486" y2="96" marker-end="url(#a)"/>
<rect class="card" x="490" y="40" width="210" height="112" rx="14"/>
<circle class="num" cx="514" cy="66" r="13"/><text class="c numt" x="514" y="71" text-anchor="middle">3</text>
<text class="h ink" x="536" y="71">Identity</text>
<text class="s muted" x="508" y="100">a key pair of your own;</text>
<text class="s muted" x="508" y="119">write down the keys</text>
<text class="s accent" x="508" y="140">DPP Manager</text>
<line class="line" x1="702" y1="96" x2="721" y2="96" marker-end="url(#a)"/>
<rect class="card" x="725" y="40" width="210" height="112" rx="14"/>
<circle class="num" cx="749" cy="66" r="13"/><text class="c numt" x="749" y="71" text-anchor="middle">4</text>
<text class="h ink" x="771" y="71">Custodian</text>
<text class="s muted" x="743" y="100">an agreement gives you</text>
<text class="s muted" x="743" y="119">a pod and a collection</text>
<text class="s accent" x="743" y="140">data intermediary</text>
<text class="lbl muted" x="20" y="192">PER PASSPORT</text>
<rect class="card" x="20" y="204" width="210" height="112" rx="14"/>
<circle class="num" cx="44" cy="230" r="13"/><text class="c numt" x="44" y="235" text-anchor="middle">5</text>
<text class="h ink" x="66" y="235">Describe</text>
<text class="s muted" x="38" y="264">fill in the form of</text>
<text class="s muted" x="38" y="283">the product type</text>
<text class="s accent" x="38" y="304">DPP Manager</text>
<line class="line" x1="232" y1="260" x2="251" y2="260" marker-end="url(#a)"/>
<rect class="card" x="255" y="204" width="210" height="112" rx="14"/>
<circle class="num" cx="279" cy="230" r="13"/><text class="c numt" x="279" y="235" text-anchor="middle">6</text>
<text class="h ink" x="301" y="235">Identifier</text>
<text class="s muted" x="273" y="264">the passport gets an</text>
<text class="s muted" x="273" y="283">identifier of its own</text>
<text class="s accent" x="273" y="304">DPP Manager</text>
<line class="line" x1="467" y1="260" x2="486" y2="260" marker-end="url(#a)"/>
<rect class="card" x="490" y="204" width="210" height="112" rx="14"/>
<circle class="num" cx="514" cy="230" r="13"/><text class="c numt" x="514" y="235" text-anchor="middle">7</text>
<text class="h ink" x="536" y="235">Submit</text>
<text class="s muted" x="508" y="264">the service stores it,</text>
<text class="s muted" x="508" y="283">the custodian keeps it</text>
<text class="s accent" x="508" y="304">DPP Service</text>
<line class="line" x1="702" y1="260" x2="721" y2="260" marker-end="url(#a)"/>
<rect class="card" x="725" y="204" width="210" height="112" rx="14"/>
<circle class="num" cx="749" cy="230" r="13"/><text class="c numt" x="749" y="235" text-anchor="middle">8</text>
<text class="h ink" x="771" y="235">Check</text>
<text class="s muted" x="743" y="264">open the link, run</text>
<text class="s muted" x="743" y="283">the DPP Linter</text>
<text class="s accent" x="743" y="304">any browser</text>
<text class="s muted" x="20" y="348">Steps 1 to 4 happen once. Steps 5 to 8 repeat for every passport.</text>
</svg>