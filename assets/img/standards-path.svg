<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Which standard covers which step</title><desc id="d">From the product to its data: EN 18220 covers the data carrier such as a QR code; EN 18219 the unique identifier, a web link naming the product; EN 18216 and EN 18222 the exchange protocols and the lifecycle API; EN 18223 the passport data; EN 18221 storage, versions, archive and back-up copy. EN 18239 on access rights, security and confidentiality and EN 18246 on authentication and integrity apply across every step; these two are published but not yet cited in the Official Journal.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1d2327}.muted{fill:#5b6770}.accent{fill:#0b6e4f}
.band1{fill:#e3f2ec}.band2{fill:#fbf0d9}.band3{fill:#e7edf7}.band4{fill:#f3e8f7}
.chip{fill:#ffffff;stroke:#8a959c;stroke-width:1.2}.chip.key{stroke:#0b6e4f;stroke-width:1.6}
.chip.plan{fill:none;stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#c9d0d4;stroke-width:1.5}.tag{fill:#e3f2ec;stroke:#0b6e4f;stroke-width:1.2}
.span{fill:none;stroke:#8a959c;stroke-width:1.4;stroke-dasharray:6 4}
.line{stroke:#0b6e4f;stroke-width:2.2;fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em}.h{font-size:15px;font-weight:700}
.s{font-size:13px}.c{font-size:13px;font-weight:600}
@media (prefers-color-scheme: dark){.bg{fill:#1b1f22}.ink{fill:#e8ebed}.muted{fill:#9aa5ad}.accent{fill:#4cc293}
.band1{fill:#173229}.band2{fill:#33291a}.band3{fill:#1d2635}.band4{fill:#2c2033}
.chip{fill:#1b1f22;stroke:#6b767d}.chip.key{stroke:#4cc293}.chip.plan{fill:none}
.box{fill:#1b1f22;stroke:#3a4247}.tag{fill:#173229;stroke:#4cc293}.span{stroke:#6b767d}.line{stroke:#4cc293}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="356"/>
<text class="lbl muted" x="20" y="30">FROM THE PRODUCT TO ITS DATA – WHICH STANDARD COVERS WHICH STEP</text>
<rect class="tag" x="60" y="52" width="90" height="28" rx="14"/><text class="c ink" x="105" y="71" text-anchor="middle">EN 18220</text>
<line class="span" x1="105.0" y1="80" x2="105.0" y2="98" style="stroke-dasharray:none"/>
<rect class="box" x="20" y="98" width="170" height="100" rx="12"/>
<text class="h ink" x="36" y="126">Data carrier</text>
<text class="s muted" x="36" y="150">QR code, NFC chip</text>
<text class="s muted" x="36" y="169">or RFID tag</text>
<line class="line" x1="191" y1="148" x2="205" y2="148" marker-end="url(#a)"/>
<rect class="tag" x="247" y="52" width="90" height="28" rx="14"/><text class="c ink" x="292" y="71" text-anchor="middle">EN 18219</text>
<line class="span" x1="292.0" y1="80" x2="292.0" y2="98" style="stroke-dasharray:none"/>
<rect class="box" x="207" y="98" width="170" height="100" rx="12"/>
<text class="h ink" x="223" y="126">Unique identifier</text>
<text class="s muted" x="223" y="150">a web link that</text>
<text class="s muted" x="223" y="169">names the product</text>
<line class="line" x1="378" y1="148" x2="392" y2="148" marker-end="url(#a)"/>
<rect class="tag" x="398" y="52" width="78" height="28" rx="14"/><text class="c ink" x="437" y="71" text-anchor="middle">EN 18216</text>
<rect class="tag" x="482" y="52" width="78" height="28" rx="14"/><text class="c ink" x="521" y="71" text-anchor="middle">EN 18222</text>
<line class="span" x1="479.0" y1="80" x2="479.0" y2="98" style="stroke-dasharray:none"/>
<rect class="box" x="394" y="98" width="170" height="100" rx="12"/>
<text class="h ink" x="410" y="126">Exchange</text>
<text class="s muted" x="410" y="150">protocols and the</text>
<text class="s muted" x="410" y="169">lifecycle API</text>
<line class="line" x1="565" y1="148" x2="579" y2="148" marker-end="url(#a)"/>
<rect class="tag" x="621" y="52" width="90" height="28" rx="14"/><text class="c ink" x="666" y="71" text-anchor="middle">EN 18223</text>
<line class="span" x1="666.0" y1="80" x2="666.0" y2="98" style="stroke-dasharray:none"/>
<rect class="box" x="581" y="98" width="170" height="100" rx="12"/>
<text class="h ink" x="597" y="126">Passport data</text>
<text class="s muted" x="597" y="150">header and</text>
<text class="s muted" x="597" y="169">data elements</text>
<line class="line" x1="752" y1="148" x2="766" y2="148" marker-end="url(#a)"/>
<rect class="tag" x="808" y="52" width="90" height="28" rx="14"/><text class="c ink" x="853" y="71" text-anchor="middle">EN 18221</text>
<line class="span" x1="853.0" y1="80" x2="853.0" y2="98" style="stroke-dasharray:none"/>
<rect class="box" x="768" y="98" width="170" height="100" rx="12"/>
<text class="h ink" x="784" y="126">Storage</text>
<text class="s muted" x="784" y="150">versions, archive,</text>
<text class="s muted" x="784" y="169">back-up copy</text>
<rect class="span" x="20" y="222" width="918" height="40" rx="10"/>
<text class="c ink" x="40" y="247">EN 18239</text><text class="s muted" x="118" y="247">access rights, information security and business confidentiality – across every step</text>
<rect class="span" x="20" y="272" width="918" height="40" rx="10"/>
<text class="c ink" x="40" y="297">EN 18246</text><text class="s muted" x="118" y="297">authentication, reliability and integrity of the data – across every step</text>
<text class="s muted" x="20" y="340">Solid: cited in the Official Journal in July 2026. Dashed: published in September 2026, not yet cited.</text>
</svg>