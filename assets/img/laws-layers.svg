<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" width="960" height="524" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Four layers of rules for the Digital Product Passport</title><desc id="d">EU regulations say that a product group has a passport and how the system works: the ESPR 2024/1781, and the regulations on batteries 2023/1542, construction products 2024/3110, toys 2025/2509 and detergents 2026/405. Delegated acts say per product group what goes in, who sees it and from when: iron and steel expected in Q4 2026, textiles, tyres and aluminium 2027, furniture 2028, mattresses 2029, and rules for DPP service providers planned for 2027. Implementing acts set up the shared infrastructure: the EU DPP registry under Implementing Regulation 2026/1778 and the citation of standards under Implementing Decision 2026/1736; battery access rules are pending. Harmonised standards say how systems are built: EN 18216, 18219, 18220, 18221, 18222 and 18223 are cited; EN 18239 and EN 18246 are published but not yet cited.</desc>
