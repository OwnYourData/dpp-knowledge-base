<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Our tools in the roles of the CIRPASS-2 reference architecture</title>
  <desc id="d">The roles of the CIRPASS-2 reference architecture, each with the components that fill it here. The responsible economic operator works with the DPP Manager and SOyA product types. Two DPP service providers act on its behalf: OwnYourData runs the DPP Service with the EN 18222 API, access classes, access log and versions; the data intermediary of DID FlexCo is the custodian that keeps the passport under a mandate and serves the public part. A back-up provider is not appointed yet. End users scan the link on the product with any phone; repairers and recyclers read more with an access grant. Other actors offer checks: the DPP Linter, the DPP Service Validator and the criteria catalogue. Credentials: access grants are signed by the operator or by an authority issuer the service lists; eIDAS role credentials are not used yet. Public authorities run the EU registry and web portal; the DPP Service offers the registry method but is not connected yet. OYDID and SOyA are shared building blocks underneath.</desc>
  <style>
    .bg { fill: #ffffff; }
    .role { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; }
    .ours { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.6; }
    .open { fill: #ffffff; stroke: #9aa5ad; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .band { fill: #e3f2ec; stroke: #b9e0cf; stroke-width: 1.2; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.2; fill: none; }
    .dash { stroke: #9aa5ad; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .grey { fill: #9aa5ad; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14px; font-weight: 700; }
    .s { font-size: 14px; }
    .lbl { font-size: 14px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .role { fill: #121517; stroke: #3a4247; }
      .ours { fill: #173229; stroke: #4cc293; }
      .open { fill: #1b1f22; stroke: #5b6770; }
      .band { fill: #173229; stroke: #2a6049; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
      .dash { stroke: #5b6770; }
      .grey { fill: #5b6770; }
    }
  </style>
  <defs>
