  <rect class="ours" x="326" y="62" width="328" height="58" rx="8"/>
  <text class="p ink" x="340" y="85">DPP Manager</text>
  <text class="s muted" x="340" y="106">describe, identify, submit, sign, grant access</text>
  <rect class="ours" x="326" y="128" width="328" height="46" rx="8"/>
  <text class="p ink" x="340" y="156">Product types in SOyA</text>
