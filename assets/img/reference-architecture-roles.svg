  <!-- DPP service providers -->
  <rect class="role" x="310" y="230" width="360" height="270" rx="14"/>
  <text class="h ink" x="328" y="258">DPP service providers</text>
  <rect class="ours" x="326" y="272" width="328" height="76" rx="8"/>
  <text class="p ink" x="340" y="295">DPP Service · OwnYourData</text>
  <text class="s muted" x="340" y="316">EN 18222 API, access classes and</text>
  <text class="s muted" x="340" y="335">grants, access log, versions</text>
  <rect class="ours" x="326" y="358" width="328" height="76" rx="8"/>
  <text class="p ink" x="340" y="381">Custodian · DID FlexCo intermediary</text>
  <text class="s muted" x="340" y="402">keeps the passport under a mandate,</text>
  <text class="s muted" x="340" y="421">serves the public part on the link</text>
  <rect class="open" x="326" y="444" width="328" height="40" rx="8"/>
  <text class="lbl muted" x="340" y="469">Back-up provider · not appointed yet</text>

  <!-- Other actors -->
  <rect class="role" x="700" y="20" width="240" height="190" rx="14"/>
  <text class="h ink" x="718" y="48">Other actors</text>
  <rect class="ours" x="716" y="62" width="208" height="38" rx="8"/>
  <text class="p ink" x="730" y="86">DPP Linter</text>
  <rect class="ours" x="716" y="108" width="208" height="38" rx="8"/>
  <text class="p ink" x="730" y="132">DPP Service Validator</text>
  <rect class="ours" x="716" y="154" width="208" height="38" rx="8"/>
  <text class="p ink" x="730" y="178">Criteria catalogue</text>

  <!-- End users and independent operators -->
  <rect class="role" x="700" y="230" width="240" height="210" rx="14"/>
  <text class="h ink" x="718" y="258">End users and</text>
  <text class="h ink" x="718" y="278">independent operators</text>
  <rect class="ours" x="716" y="292" width="208" height="58" rx="8"/>
  <text class="p ink" x="730" y="315">Repairer, recycler</text>
  <text class="s muted" x="730" y="336">with a grant: more classes</text>
  <rect class="ours" x="716" y="358" width="208" height="62" rx="8"/>
  <text class="p ink" x="730" y="381">Any phone</text>
  <text class="s muted" x="730" y="402">scans the link: public part</text>

  <!-- arrows -->
  <line class="line" x1="490" y1="190" x2="490" y2="226" marker-end="url(#a)"/>
  <text class="lbl accent" x="500" y="213">submit, mandate</text>
  <line class="line" x1="672" y1="396" x2="696" y2="396" marker-end="url(#a)"/>
  <line class="line" x1="672" y1="320" x2="696" y2="320" marker-end="url(#a)"/>
  <line class="line" x1="698" y1="150" x2="672" y2="270" marker-end="url(#a)"/>
  <text class="lbl accent" x="628" y="222">check</text>
  <line class="dash" x1="308" y1="100" x2="284" y2="100" marker-end="url(#g)"/>
  <line class="line" x1="284" y1="310" x2="308" y2="310" marker-end="url(#a)"/>

  <!-- shared building blocks -->
  <rect class="band" x="20" y="520" width="920" height="64" rx="14"/>
  <text class="h ink" x="38" y="548">Shared building blocks</text>
  <text class="s ink" x="232" y="548"><tspan font-weight="700">OYDID</tspan> – did:oyd passport identifiers, signed log, content binding</text>
  <text class="s ink" x="232" y="570"><tspan font-weight="700">SOyA</tspan> – data models, translations and SHACL shapes for EN 18223 passports</text>

  <!-- legend -->
  <rect class="ours" x="20" y="604" width="28" height="18" rx="4"/>
  <text class="s muted" x="56" y="618">in use here</text>
  <rect class="open" x="250" y="604" width="28" height="18" rx="4"/>
  <text class="s muted" x="286" y="618">not connected or not covered yet</text>
  <text class="s muted" x="560" y="618">Roles after CIRPASS-2 D4.1 (CC BY 4.0)</text>
</svg>
