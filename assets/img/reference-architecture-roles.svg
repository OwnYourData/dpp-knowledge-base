  <rect class="bg" x="0" y="0" width="960" height="640"/>

  <!-- Public authorities -->
  <rect class="role" x="20" y="20" width="260" height="190" rx="14"/>
  <text class="h ink" x="38" y="48">Public authorities</text>
  <rect class="open" x="36" y="62" width="228" height="34" rx="8"/>
  <text class="lbl muted" x="50" y="84">EU DPP registry</text>
  <rect class="open" x="36" y="104" width="228" height="34" rx="8"/>
  <text class="lbl muted" x="50" y="126">EU web portal</text>
  <text class="s muted" x="38" y="162">The DPP Service offers the</text>
  <text class="s muted" x="38" y="182">registry method; not connected yet</text>

  <!-- Credentials agencies -->
  <rect class="role" x="20" y="230" width="260" height="210" rx="14"/>
  <text class="h ink" x="38" y="258">Credentials agencies</text>
  <rect class="ours" x="36" y="272" width="228" height="76" rx="8"/>
  <text class="p ink" x="50" y="295">Access grants</text>
  <text class="s muted" x="50" y="316">signed by the operator or by</text>
  <text class="s muted" x="50" y="335">a listed authority issuer</text>
  <rect class="open" x="36" y="358" width="228" height="62" rx="8"/>
  <text class="lbl muted" x="50" y="383">eIDAS role credentials</text>
  <text class="s muted" x="50" y="404">not used yet</text>

