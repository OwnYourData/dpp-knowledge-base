<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Public and protected data: the recommendation and the implementation here</title>
  <desc id="d">Left, the CIRPASS-2 recommendation: a public passport document names the endpoints of role-specific data sets, and each role-specific set carries the hash of the public document it extends. Right, the implementation here: the passport's DID document carries the hash of the public card; the public card carries a salted digest of one controlled card that holds every attribute that is not public; the DPP Service gives each reader the classes it may read from it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f7f7f5; stroke: #c9d0d4; stroke-width: 1.5; }
    .pub { fill: #ffffff; stroke: #0b6e4f; stroke-width: 1.6; }
    .prot { fill: #e3f2ec; stroke: #0b6e4f; stroke-width: 1.6; }
    .did { fill: #ffffff; stroke: #c9d0d4; stroke-width: 1.5; }
    .ink { fill: #1d2327; }
    .muted { fill: #5b6770; }
    .accent { fill: #0b6e4f; }
    .line { stroke: #0b6e4f; stroke-width: 2.2; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 700; }
    .p { font-size: 14px; font-weight: 700; }
    .s { font-size: 14px; }
    .lbl { font-size: 14px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .panel { fill: #121517; stroke: #3a4247; }
      .pub { fill: #1b1f22; stroke: #4cc293; }
      .prot { fill: #173229; stroke: #4cc293; }
      .did { fill: #1b1f22; stroke: #3a4247; }
      .ink { fill: #e8ebed; }
      .muted { fill: #9aa5ad; }
      .accent { fill: #4cc293; }
      .line { stroke: #4cc293; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="400"/>

  <!-- left: recommendation -->
  <rect class="panel" x="20" y="20" width="450" height="360" rx="14"/>
  <text class="h ink" x="40" y="50">CIRPASS-2 recommendation</text>
  <text class="s muted" x="40" y="72">public document plus one data set per role</text>

  <rect class="pub" x="110" y="96" width="270" height="76" rx="10"/>
  <text class="p ink" x="126" y="120">Public passport</text>
  <text class="s muted" x="126" y="141">public data, signed;</text>
  <text class="s muted" x="126" y="160">names the role endpoints</text>

  <rect class="prot" x="40" y="250" width="190" height="96" rx="10"/>
  <text class="p ink" x="56" y="274">Data set for role A</text>
  <text class="s muted" x="56" y="296">signed; carries the</text>
  <text class="s muted" x="56" y="315">hash of the public</text>
  <text class="s muted" x="56" y="334">passport</text>
  <rect class="prot" x="260" y="250" width="190" height="96" rx="10"/>
  <text class="p ink" x="276" y="274">Data set for role B</text>
  <text class="s muted" x="276" y="296">signed; carries the</text>
  <text class="s muted" x="276" y="315">hash of the public</text>
  <text class="s muted" x="276" y="334">passport</text>

  <line class="line" x1="135" y1="248" x2="190" y2="176" marker-end="url(#a)"/>
  <line class="line" x1="355" y1="248" x2="300" y2="176" marker-end="url(#a)"/>
  <text class="lbl accent" x="196" y="222">extends</text>

  <!-- right: here -->
  <rect class="panel" x="490" y="20" width="450" height="360" rx="14"/>
  <text class="h ink" x="510" y="50">Here</text>
  <text class="s muted" x="510" y="72">public card plus one controlled card</text>

  <rect class="did" x="510" y="90" width="410" height="62" rx="10"/>
  <text class="p ink" x="526" y="114">DID document of the passport</text>
  <text class="s muted" x="526" y="136">signed log; carries the payloadHash of the public card</text>

  <rect class="pub" x="510" y="180" width="410" height="66" rx="10"/>
  <text class="p ink" x="526" y="204">Public card · served on the link on the product</text>
  <text class="s muted" x="526" y="226">public attributes + ControlledData, a salted digest</text>

  <rect class="prot" x="510" y="274" width="410" height="92" rx="10"/>
  <text class="p ink" x="526" y="298">Controlled card · held by the custodian</text>
  <text class="s muted" x="526" y="320">every attribute that is not public;</text>
  <text class="s muted" x="526" y="340">the DPP Service gives each reader</text>
  <text class="s muted" x="526" y="359">only the classes it may read</text>

  <line class="line" x1="715" y1="154" x2="715" y2="176" marker-end="url(#a)"/>
  <line class="line" x1="715" y1="248" x2="715" y2="270" marker-end="url(#a)"/>
  <text class="lbl accent" x="726" y="170">binds</text>
  <text class="lbl accent" x="726" y="264">binds</text>
</svg>
