<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Anatomy of a criterion</title>
  <desc id="d">A criterion is one YAML file, here DPP-ID-001, product identifier resolves to its passport. Four parts: what applies – the statement paraphrasing the source and the level MUST; where it comes from – the basis with legal act or standard, clause and kind of source; who and how – the target passport and the method automated; and the check – the check type resolve with its parameters, plus the catalogue rows it covers.</desc>
  <style>
    .bg { fill: #ffffff; }
    .code { fill: #f0f2f1; stroke: #c9d0d4; stroke-width: 1.2; }
    .k { fill: #0b6e4f; }
    .v { fill: #1d2327; }
    .c { fill: #5b6770; }
    .band1 { fill: #e3f2ec; } .band2 { fill: #fbf0d9; } .band3 { fill: #e7edf7; } .band4 { fill: #f3e8f7; }
    .num { fill: #0b6e4f; } .numt { fill: #ffffff; }
    .ink { fill: #1d2327; } .muted { fill: #5b6770; }
    .lead { stroke: #8a959c; stroke-width: 1.3; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: pre; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; }
    .n { font-size: 13px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f22; }
      .code { fill: #22272b; stroke: #3a4247; }
      .k { fill: #4cc293; } .v { fill: #e8ebed; } .c { fill: #9aa5ad; }
      .band1 { fill: #173229; } .band2 { fill: #33291a; } .band3 { fill: #1d2635; } .band4 { fill: #2c2033; }
      .num { fill: #4cc293; } .numt { fill: #121517; }
      .ink { fill: #e8ebed; } .muted { fill: #9aa5ad; }
      .lead { stroke: #6b767d; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="520"/>
  <rect class="code" x="20" y="20" width="500" height="480" rx="12"/>

  <!-- bands -->
  <rect class="band1" x="28" y="92" width="484" height="78" rx="4"/>
  <rect class="band2" x="28" y="172" width="484" height="120" rx="4"/>
  <rect class="band3" x="28" y="294" width="484" height="40" rx="4"/>
  <rect class="band4" x="28" y="336" width="484" height="102" rx="4"/>

  <text class="m c" x="40" y="46">criteria/id/DPP-ID-001.yaml</text>
  <text class="m" x="40" y="70"><tspan class="k">id:</tspan><tspan class="v"> DPP-ID-001</tspan><tspan class="k">   version:</tspan><tspan class="v"> 2</tspan><tspan class="k">   status:</tspan><tspan class="v"> active</tspan></text>
  <text class="m" x="40" y="88"><tspan class="k">title:</tspan><tspan class="v"> Product identifier resolves to its passport</tspan></text>
  <text class="m" x="40" y="110"><tspan class="k">statement:</tspan><tspan class="v"> A DPP MUST be connected to a persistent</tspan></text>
  <text class="m v" x="40" y="128">  unique product identifier that resolves to</text>
  <text class="m v" x="40" y="146">  exactly this passport.</text>
  <text class="m" x="40" y="164"><tspan class="k">level:</tspan><tspan class="v"> MUST</tspan></text>
  <text class="m k" x="40" y="190">basis:</text>
  <text class="m" x="40" y="208"><tspan class="v">- </tspan><tspan class="k">source:</tspan><tspan class="v"> Regulation (EU) 2024/1781 (ESPR)</tspan></text>
  <text class="m" x="40" y="226"><tspan class="k">  clause:</tspan><tspan class="v"> Art. 10(1)(a)</tspan><tspan class="k">  kind:</tspan><tspan class="v"> regulation</tspan></text>
  <text class="m" x="40" y="248"><tspan class="v">- </tspan><tspan class="k">source:</tspan><tspan class="v"> EN 18219:2026</tspan></text>
  <text class="m" x="40" y="266"><tspan class="k">  clause:</tspan><tspan class="v"> 4.5.2 (1)</tspan><tspan class="k">  kind:</tspan><tspan class="v"> harmonised-standard</tspan></text>
  <text class="m c" x="40" y="284">- …</text>
  <text class="m" x="40" y="318"><tspan class="k">target:</tspan><tspan class="v"> passport</tspan><tspan class="k">   method:</tspan><tspan class="v"> automated</tspan></text>
  <text class="m k" x="40" y="358">check:</text>
  <text class="m" x="40" y="376"><tspan class="k">  type:</tspan><tspan class="v"> resolve</tspan></text>
  <text class="m" x="40" y="394"><tspan class="k">  accept:</tspan><tspan class="v"> application/json</tspan></text>
  <text class="m" x="40" y="422"><tspan class="k">catalogue_ref:</tspan><tspan class="v"> [DPP-ID-001, DPP-CAR-004]</tspan></text>
  <text class="m" x="40" y="462"><tspan class="k">notes:</tspan><tspan class="v"> Only the digital half is testable …</tspan></text>

  <!-- callouts -->
  <circle class="num" cx="560" cy="110" r="13"/><text class="n numt" x="560" y="115" text-anchor="middle">1</text>
  <text class="h ink" x="584" y="108">What applies</text>
  <text class="s muted" x="584" y="128">the statement paraphrases the source –</text>
  <text class="s muted" x="584" y="146">never copied standard text; level MUST,</text>
  <text class="s muted" x="584" y="164">SHOULD or MAY</text>
  <line class="lead" x1="514" y1="130" x2="544" y2="114"/>

  <circle class="num" cx="560" cy="210" r="13"/><text class="n numt" x="560" y="215" text-anchor="middle">2</text>
  <text class="h ink" x="584" y="208">Where it comes from</text>
  <text class="s muted" x="584" y="228">legal act or standard, the exact clause,</text>
  <text class="s muted" x="584" y="246">and the kind of source</text>
  <line class="lead" x1="514" y1="230" x2="544" y2="214"/>

  <circle class="num" cx="560" cy="310" r="13"/><text class="n numt" x="560" y="315" text-anchor="middle">3</text>
  <text class="h ink" x="584" y="308">Who and how</text>
  <text class="s muted" x="584" y="328">target: passport, service or operator;</text>
  <text class="s muted" x="584" y="346">method: automated, with test credentials,</text>
  <text class="s muted" x="584" y="364">or self-declared</text>
  <line class="lead" x1="514" y1="314" x2="544" y2="310"/>

  <circle class="num" cx="560" cy="410" r="13"/><text class="n numt" x="560" y="415" text-anchor="middle">4</text>
  <text class="h ink" x="584" y="408">The check</text>
  <text class="s muted" x="584" y="428">one of nine check types with its</text>
  <text class="s muted" x="584" y="446">parameters; catalogue_ref names the</text>
  <text class="s muted" x="584" y="464">catalogue rows it covers</text>
  <line class="lead" x1="514" y1="386" x2="544" y2="406"/>
</svg>
