<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Research projects and initiatives around the Digital Product Passport</title><desc id="d">Five groups. Specifications say what a passport looks like: the European standards EN 18216 and EN 18219 to 18223 from CEN/CENELEC JTC 24, the Asset Administration Shell release 26-01 of the IDTA, the GS1 Digital Link, the UN Transparency Protocol 0.8, W3C Verifiable Credentials 2.0, and OPC 30450-1, still a release candidate. EU projects try it out at scale: CIRPASS-2 with 49 partners and 13 pilots, CE-RISE, Catena-X and Eclipse Tractus-X, and Eclipse OSS4DPP, which has not launched yet. Tests and reference data: the BatteryPass-Ready test environment, the CIRPASS-2 test environment, the battery data model 2.0.1, the CIRPASS-2 ontologies and the UNTP playground. Public infrastructure: the EU DPP registry, live since 20 July 2026; registering passports and rules for DPP service providers are still pending. In Austria: the lighthouse projects PACE-DPP, where the tools of this knowledge base come from, and PASSAT, coordinated by AIT from 2025 to 2028, the Plattform Industrie 4.0 Österreich and the demonstrator of GS1 Austria.</desc>
