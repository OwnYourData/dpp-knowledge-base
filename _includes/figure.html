<figure class="fig{% if include.screenshot %} screenshot{% endif %}">
  <div class="frame"><a href="{{ include.src | relative_url }}" title="Open full size"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy"{% if include.maxwidth %} style="max-width:{{ include.maxwidth }}px"{% endif %}{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %}></a></div>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
