<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("kb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/kb.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.search %}<link rel="stylesheet" href="{{ '/pagefind/pagefind-ui.css' | relative_url }}">{% endif %}
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">DPP Knowledge Base <span>· OwnYourData</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Articles</a>
      <a href="/">DPP Service</a>
      <a href="/api-docs/index.html">API</a>
      <a href="https://github.com/OwnYourData/dpp-knowledge-base">GitHub</a>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site">
  <div class="wrap">
    <div>Written and operated by <a href="https://www.ownyourdata.eu/en/">OwnYourData</a> · Content under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></div>
    <div>
      <a href="https://www.ownyourdata.eu/en/imprint/">Imprint</a>
      <a href="https://www.ownyourdata.eu/en/privacy-policy/">Privacy</a>
    </div>
  </div>
</footer>

<script>
(function () {
  var b = document.getElementById("theme-toggle"), r = document.documentElement;
  var m = window.matchMedia("(prefers-color-scheme: dark)");
  function system() { return m.matches ? "dark" : "light"; }
  function current() { return r.getAttribute("data-theme") || system(); }
  function show() {
    var dark = current() === "dark";
    b.setAttribute("data-mode", dark ? "dark" : "light");
    b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    b.title = b.getAttribute("aria-label");
  }
  b.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    try {
      if (next === system()) { r.removeAttribute("data-theme"); localStorage.removeItem("kb-theme"); }
      else { r.setAttribute("data-theme", next); localStorage.setItem("kb-theme", next); }
    } catch (e) { r.setAttribute("data-theme", next); }
    show();
  });
  if (m.addEventListener) m.addEventListener("change", show);
  b.hidden = false;
  show();
})();
</script>

{% if page.search %}
<script src="{{ '/pagefind/pagefind-ui.js' | relative_url }}"></script>
<script>
  if (window.PagefindUI) {
    new PagefindUI({ element: "#search", showSubResults: true, showImages: false, resetStyles: false });
  }
</script>
{% endif %}
</body>
</html>
