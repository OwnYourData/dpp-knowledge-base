name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example 261029a"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag and the image name
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ vars.IMAGE }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]{6}[a-z]$ ]]; then
            echo "The tag must look like 261029a." >&2
            exit 1
          fi
          if [[ -z "$IMAGE" ]]; then
            echo "The repository variable IMAGE is not set." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
